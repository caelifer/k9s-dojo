# Toolchain for k9s-dojo. Everything the repository runs on comes from here
# instead of the host package manager: `make deps` installs all of it.
#
# podman/podman-compose are deliberately absent: they are a container runtime
# with kernel, cgroup and rootless integration, so they stay a host dependency.

[tools]
k9s = "latest"
kubectl = "latest"
uv = "latest"
jq = "latest"
python = "3.12"

# The aqua entry for this package ships the `kwok` controller instead of
# `kwokctl`, so the release binary is pinned directly.
[tools."http:kwokctl"]
version = "0.8.0"

[tools."http:kwokctl".platforms]
linux-x64 = { url = "https://github.com/kubernetes-sigs/kwok/releases/download/v{{ version }}/kwokctl-linux-amd64" }
linux-arm64 = { url = "https://github.com/kubernetes-sigs/kwok/releases/download/v{{ version }}/kwokctl-linux-arm64" }
macos-x64 = { url = "https://github.com/kubernetes-sigs/kwok/releases/download/v{{ version }}/kwokctl-darwin-amd64" }
macos-arm64 = { url = "https://github.com/kubernetes-sigs/kwok/releases/download/v{{ version }}/kwokctl-darwin-arm64" }

[tasks.install]
description = "Install the toolchain and the Python dependencies the scripts need"
run = [
  "mise install",
  "uv pip install --system -r requirements.txt",
]

[tasks.setup]
description = "Build the two simulated clusters"
run = "make setup"
