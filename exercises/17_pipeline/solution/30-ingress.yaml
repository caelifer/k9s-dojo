apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: collector
  namespace: pipeline
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
    nginx.ingress.kubernetes.io/proxy-body-size: 8m
spec:
  ingressClassName: nginx
  rules:
    - host: collector.dojo.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: collector-edge
                port:
                  number: 4318
  tls:
    - hosts:
        - collector.dojo.local
      secretName: collector-tls
