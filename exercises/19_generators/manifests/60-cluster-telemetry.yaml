# 60-cluster-telemetry.yaml -- fill in every TODO.
#
# Application telemetry is only half the picture. A cluster pipeline also has to
# collect what the cluster itself exposes: object state from kube-state-metrics
# and host metrics from node-exporter.
#
# Requirements:
#   - ServiceAccount `kube-state-metrics` in the pipeline namespace
#   - ClusterRole `dojo-kube-state-metrics`: list/watch on pods, nodes, services,
#     namespaces (core), deployments, statefulsets, daemonsets, replicasets
#     (apps), jobs, cronjobs (batch)
#   - ClusterRoleBinding `dojo-kube-state-metrics` wiring the two together
#   - Deployment `kube-state-metrics`, 1 replica,
#     image registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.13.0,
#     port 8080, serviceAccountName kube-state-metrics
#   - Service `kube-state-metrics` on 8080
#   - DaemonSet `node-exporter`, tolerating every taint,
#     image quay.io/prometheus/node-exporter:v1.8.2, port 9100,
#     hostPath mounts for /proc, /sys and / (read-only)
#   - Service `node-exporter` on 9100
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-state-metrics
  namespace: pipeline
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dojo-kube-state-metrics
rules: []
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dojo-kube-state-metrics
subjects: []
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: dojo-kube-state-metrics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-state-metrics
  namespace: pipeline
spec:
  # TODO: replicas, selector, pod template (serviceAccountName, port 8080)
  selector:
    matchLabels:
      app: kube-state-metrics
  template:
    metadata:
      labels:
        app: kube-state-metrics
    spec:
      containers: []
---
apiVersion: v1
kind: Service
metadata:
  name: kube-state-metrics
  namespace: pipeline
spec:
  # TODO: selector + port 8080
  selector:
    app: kube-state-metrics
  ports: []
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-exporter
  namespace: pipeline
spec:
  # TODO: selector, template with tolerations, hostPath mounts, port 9100
  selector:
    matchLabels:
      app: node-exporter
  template:
    metadata:
      labels:
        app: node-exporter
    spec:
      containers: []
---
apiVersion: v1
kind: Service
metadata:
  name: node-exporter
  namespace: pipeline
spec:
  # TODO: selector + port 9100
  selector:
    app: node-exporter
  ports: []
