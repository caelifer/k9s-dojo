# Docker override for the live stack: docker does not resolve
# host.containers.internal, so kube-state-metrics has to be reached through the
# host-gateway alias instead. bin/ui adds this file when DOJO_ENGINE=docker.
services:
  otel-collector:
    extra_hosts:
      - "host.docker.internal=host-gateway"
    environment:
      # only the events receiver needs the host alias under docker
      KUBECONFIG: /etc/kubeconfig/kubeconfig
