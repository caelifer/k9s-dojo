server:
  http_listen_port: 3200
  grpc_listen_port: 9095

metrics_generator:
  # Single binary: the generator's ring must be in-memory, or the distributor
  # sees zero generator clients and never forwards spans to it.
  ring:
    kvstore:
      store: inmemory
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://mimir:9009/api/v1/push
        send_exemplars: true
overrides:
  defaults:
    metrics_generator:
      processors:
        - service-graphs
        - span-metrics

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

ingester:
  trace_idle_period: 10s
  max_block_bytes: 1000000
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 1h

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks
