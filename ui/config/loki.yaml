auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  allow_structured_metadata: true
  volume_enabled: true
  # index the event identity so Grafana can filter by reason/kind instead of
  # only by the involved object's name
  otlp_config:
    resource_attributes:
      attributes_config:
        - action: index_label
          attributes:
            - event.kind
            - k8s.namespace.name

analytics:
  reporting_enabled: false
