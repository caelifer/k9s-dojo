receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  # The cluster's own telemetry: kube-state-metrics runs with host networking so
  # it can reach the dojo API server on loopback, node-exporter reads the host
  # pid namespace, and the collector scrapes itself for otelcol_* series.
  prometheus:
    config:
      scrape_configs:
        - job_name: kube-state-metrics
          scrape_interval: 15s
          static_configs:
            - targets: ["host.containers.internal:8080"]
        - job_name: node-exporter
          scrape_interval: 15s
          static_configs:
            - targets: ["node-exporter:9100"]
        - job_name: otel-collector
          scrape_interval: 15s
          static_configs:
            - targets: ["otel-collector:8888"]

processors:
  # `insert` only writes when the resource attribute is absent, so producers that
  # name their service keep it; anything else stops showing as "unknown service".
  # This must be the resource processor, not attributes: the latter would attach
  # service.name to every datapoint and log record as well.
  resource/service:
    attributes:
      - key: service.name
        value: unattributed-service
        action: insert
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
  batch:
    timeout: 5s
    send_batch_size: 1024

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
  prometheusremotewrite/mimir:
    endpoint: http://mimir:9009/api/v1/push
    # turn resource attributes into Prometheus labels, so a metric carries the
    # service that produced it (service_name, service_version, instance id)
    resource_to_telemetry_conversion:
      enabled: true

service:
  telemetry:
    logs:
      level: warn
    metrics:
      address: 0.0.0.0:8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [resource/service, memory_limiter, batch]
      exporters: [otlp/tempo]
    metrics:
      # no service fallback here: scraped targets are identified by job, and
      # naming them "unattributed-service" would only add noise
      receivers: [otlp, prometheus]
      processors: [memory_limiter, batch]
      exporters: [prometheusremotewrite/mimir]
    logs:
      receivers: [otlp]
      processors: [resource/service, memory_limiter, batch]
      exporters: [otlphttp/loki]
