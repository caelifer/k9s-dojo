# Grafana provisioning for the dojo: a dashboard provider and the sidecar that
# picks up dashboard ConfigMaps from anywhere in the cluster.
#
# The two prebuilt dashboards are generated from dashboards/*.json by kustomize
# (see kustomization.yaml), so the files in this repository are the single
# source of truth -- the same JSON is mounted into the live UI stack under ui/.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: grafana-dashboards
  namespace: observability
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dojo-grafana-dashboards
rules:
- apiGroups:
  - ''
  resources:
  - configmaps
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dojo-grafana-dashboards
subjects:
- kind: ServiceAccount
  name: grafana-dashboards
  namespace: observability
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: dojo-grafana-dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: observability
data:
  provider.yaml: "apiVersion: 1\nproviders:\n  - name: dojo\n    folder: Dojo\n  \
    \  type: file\n    disableDeletion: false\n    allowUiUpdates: true\n    options:\n\
    \      path: /var/lib/grafana/dashboards\n      foldersFromFilesStructure: false\n"
