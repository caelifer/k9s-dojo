apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shop-edge
  namespace: shop
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 8m
spec:
  ingressClassName: nginx
  rules:
    - host: shop.dojo.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
  tls:
    - hosts:
        - shop.dojo.local
      secretName: shop-tls
