# Static volumes for the stateful workloads. A real cluster gets these from a
# CSI driver; the simulated one has none, so the claims are satisfied by hand.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-data-0
  labels:
    dojo.azure/pool: data
spec:
  capacity:
    storage: 1Gi
  accessModes: ["ReadWriteOnce"]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  hostPath:
    path: /var/lib/dojo/pv-data-0
---
