apiVersion: v1
kind: ResourceQuota
metadata:
  name: shop-compute
  namespace: shop
spec:
  hard:
    pods: "40"
    requests.cpu: "4"
    requests.memory: 64Gi
    limits.cpu: "16"
    limits.memory: 128Gi
---
apiVersion: v1
kind: LimitRange
metadata:
  name: shop-defaults
  namespace: shop
spec:
  limits:
    - type: Container
      default:
        cpu: 250m
        memory: 256Mi
      defaultRequest:
        cpu: 50m
        memory: 64Mi
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: payments-compute
  namespace: payments
spec:
  hard:
    pods: "20"
    requests.cpu: "2"
    requests.memory: 4Gi
