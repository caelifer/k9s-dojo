apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - 00-namespaces.yaml
  - 10-quotas.yaml
  - 20-shop.yaml
  - 30-payments.yaml
  - 40-ops.yaml
  - 50-addons.yaml
  - 60-storage.yaml
  - 70-statefulset.yaml
  - 80-ingress.yaml
  - 85-lgtm.yaml
  - 86-dashboards.yaml
configMapGenerator:
  - name: grafana-dashboard-k8s
    namespace: observability
    options:
      labels:
        grafana_dashboard: "1"
      disableNameSuffixHash: true
    files:
      - dashboards/k8s-cluster-overview.json
  - name: grafana-dashboard-pipeline
    namespace: observability
    options:
      labels:
        grafana_dashboard: "1"
      disableNameSuffixHash: true
    files:
      - dashboards/pipeline-components.json
