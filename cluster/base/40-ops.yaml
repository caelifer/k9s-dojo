apiVersion: v1
kind: ServiceAccount
metadata:
  name: metrics-reader
  namespace: ops
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: metrics-agent
  namespace: ops
  labels:
    app: metrics-agent
    tier: platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: metrics-agent
  template:
    metadata:
      labels:
        app: metrics-agent
        tier: platform
    spec:
      serviceAccountName: metrics-reader
      containers:
        - name: agent
          image: mcr.microsoft.com/oss/kubernetes/metrics-scraper:v1.0.11
          command: ["sh", "-c", "sleep infinity"]
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
