apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-canary
  namespace: shop
  labels:
    app: frontend-canary
    track: canary
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend-canary
  template:
    metadata:
      labels:
        app: frontend-canary
        tier: web
        track: canary
    spec:
      containers:
        - name: nginx
          image: nginx:1.28-alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
